<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 空: 明るい青から、夕暮れの紫へ -->
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset="0.55" stop-color="#6f7dff"/>
      <stop offset="1" stop-color="#9a5bff"/>
    </linearGradient>
    <!-- 太陽 -->
    <radialGradient id="sun" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#fffbc4"/>
      <stop offset="0.45" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff8a2b"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe27a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffe27a" stop-opacity="0"/>
    </radialGradient>
    <!-- 雲 -->
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e4ff"/>
    </linearGradient>
    <radialGradient id="light" cx="0.3" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景（iPhone が角を丸くするので、四角いまま全面を塗る） -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#light)"/>

  <!-- 太陽（光と本体） -->
  <circle cx="196" cy="198" r="170" fill="url(#glow)"/>
  <circle cx="196" cy="198" r="104" fill="url(#sun)"/>

  <!-- 雲（太陽の右下に重ねる） -->
  <g filter="url(#shadow)">
    <path fill="url(#cloud)" d="
      M 168 404
      a 62 62 0 0 1 -6 -123.7
      a 84 84 0 0 1 160 -22
      a 72 72 0 0 1 36 145.7
      z"/>
  </g>
</svg>
