<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d6e9f8">
<script>
  // Safari 上部の色と、ページ全体の下地の色を、最初の表示から時間帯に合わせる（あとで天気に合わせて更新される）
  (function () {
    var h = new Date().getHours();
    var c = (h >= 19 || h < 5) ? "#070b22" : (h < 7) ? "#34336b" : (h < 16) ? "#d6e9f8" : "#2f2a63";
    document.querySelector('meta[name="theme-color"]').setAttribute("content", c);
    document.documentElement.style.backgroundColor = c;
  })();
</script>
<!-- ホーム画面に追加したときのアイコン・名前（iPhone の Safari 用） -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="お天気">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>お天気チェック</title>
<style>
  * { box-sizing: border-box; }
  /* 天気に合わせた背景（body の data-weather で切り替える） */
  body {
    --bg: linear-gradient(180deg, #d6e9f8 0%, #eaf3fb 100%);
    --fg: #1f2d3d;
   
   
    --overlay: transparent;
  }
  body[data-weather="sunny"] { --bg: linear-gradient(180deg, #3d9be9 0%, #9ad1ff 55%, #ffe9a8 100%); --fg: #10294a; }
  body[data-weather="partly"] { --bg: linear-gradient(180deg, #6fb1e6 0%, #bfdcf2 60%, #eef0f2 100%); --fg: #10294a; }
  body[data-weather="cloudy"] { --bg: linear-gradient(180deg, #aab5c2 0%, #cfd6de 60%, #e6eaee 100%); --fg: #1f2d3d; }
  body[data-weather="fog"] { --bg: linear-gradient(180deg, #c9ced3 0%, #e1e4e7 100%); --fg: #1f2d3d; }
  body[data-weather="rain"] { --bg: linear-gradient(180deg, #2f3d52 0%, #4a5c75 60%, #5a6d86 100%); --fg: #f1f5f9; }
  body[data-weather="snow"] { --bg: linear-gradient(180deg, #9db9d6 0%, #d3e2f0 55%, #f4f8fc 100%); --fg: #12304d; }
  body[data-weather="storm"] { --bg: linear-gradient(180deg, #221f38 0%, #3d3858 60%, #514b72 100%); --fg: #f1f5f9; }
  /* 時間帯（朝焼け・夕焼け・夜）は、天気の色の上に重ねる。昼は天気の色のまま */
  body[data-phase="dawn"] { --bg: linear-gradient(180deg, #34336b 0%, #c06a9a 45%, #ffb47a 75%, #ffe0a8 100%); --fg: #ffffff; }
  body[data-phase="sunset"] { --bg: linear-gradient(180deg, #2f2a63 0%, #b5516b 40%, #f08a4b 72%, #ffc371 100%); --fg: #ffffff; }
  body[data-phase="night"] { --bg: linear-gradient(180deg, #070b22 0%, #14214a 55%, #27386b 100%); --fg: #eaf0ff; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg); /* 予備。実際に見える背景は、画面に固定した #sky の層に描く */
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* 雨・雪・太陽の動き（背景の後ろ。操作はじゃましない） */
  /* 空・景色（天気・時間帯・季節で毎日変わる。カードの後ろ） */
  #sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; background: var(--bg); }
  #sky .wx-overlay { position: absolute; inset: 0; background: var(--overlay); }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: twinkle 3s ease-in-out infinite; }
  .star.w { width: 3px; height: 3px; background: #fff; box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.7); }
  @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
  .meteor {
    position: absolute; top: 8%; left: 78%; width: 90px; height: 2px; opacity: 0;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0), #fff);
    animation: meteor 18s linear infinite;
  }
  @keyframes meteor {
    0%, 93% { opacity: 0; transform: translate(0, 0) rotate(-28deg); }
    94% { opacity: 1; }
    100% { opacity: 0; transform: translate(-280px, 150px) rotate(-28deg); }
  }
  .orb { position: absolute; transform: translate(-50%, -50%); transition: left 1s, top 1s, opacity 1s; }
  .orb.sun {
    width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(circle, #fffbd0 0%, #ffe066 38%, rgba(255, 214, 80, 0.55) 55%, rgba(255, 214, 80, 0) 72%);
    animation: sunpulse 6s ease-in-out infinite alternate;
  }
  @keyframes sunpulse { from { filter: brightness(0.95); } to { filter: brightness(1.12); } }
  .orb.moon { font-size: 64px; line-height: 1; text-shadow: 0 0 22px rgba(255, 244, 200, 0.85); }
  .cloud {
    position: absolute; left: -45%; width: var(--w); height: var(--h); border-radius: 999px; filter: blur(4px);
    animation: drift var(--dur) linear infinite; animation-delay: var(--delay);
  }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  .cloud::before { width: 52%; height: 170%; left: 14%; top: -75%; }
  .cloud::after { width: 38%; height: 135%; right: 14%; top: -45%; }
  @keyframes drift { to { transform: translateX(215vw); } }
  .leaf { position: absolute; top: -8%; font-size: var(--fs); animation: leaf var(--dur) linear infinite; animation-delay: var(--delay); }
  @keyframes leaf { to { transform: translate(var(--dx), 115vh) rotate(var(--rot)); } }
  .firefly {
    position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #eaff80;
    box-shadow: 0 0 8px 3px rgba(234, 255, 128, 0.7); animation: floaty var(--dur) ease-in-out infinite alternate; animation-delay: var(--delay);
  }
  @keyframes floaty { from { transform: translate(0, 0); opacity: 0.15; } to { transform: translate(var(--dx), var(--dy)); opacity: 1; } }
  .rainbow { position: absolute; left: -10%; width: 120%; top: 6%; height: 40%; opacity: 0.6; animation: fadein 3s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 0.6; } }
  .land { position: absolute; left: 0; bottom: 0; width: 100%; height: 120px; }
  .greeting { text-align: center; margin: -10px 0 16px; font-size: 0.85rem; color: var(--fg); }
  #sky.still * { animation: none !important; transition: none !important; }
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  main, footer { position: relative; z-index: 1; }
  .drop {
    position: absolute; top: -8%; width: 2px; height: 18px; border-radius: 1px;
    background: rgba(255, 255, 255, 0.5);
    animation: fall linear infinite;
  }
  @keyframes fall { to { transform: translate(-30px, 120vh); } }
  .flake {
    position: absolute; top: -4%; width: var(--s); height: var(--s); border-radius: 50%;
    background: #fff; opacity: 0.85;
    animation: snow linear infinite;
  }
  @keyframes snow { to { transform: translate(var(--dx), 112vh); } }
  @media (prefers-reduced-motion: reduce) { #fx { display: none; } }
  .controls, .result, .card {
    color: #1f2d3d;
    background: rgba(255, 255, 255, 0.88);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  /* 並び替え */
  .edit-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .edit-btn {
    font-size: 0.8rem; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid #b8c6d4; background: rgba(255, 255, 255, 0.92); color: #1f2d3d;
  }
  .edit-btn[aria-pressed="true"] { background: #1971c2; border-color: #1971c2; color: #fff; }
  .sec-bar { display: none; }
  body.editing .sec-bar {
    display: flex; align-items: center; gap: 8px; margin-top: 16px;
    color: var(--fg); font-size: 0.85rem; font-weight: bold;
  }
  body.editing .sec > .result, body.editing .sec > .card { margin-top: 6px; outline: 2px dashed rgba(25, 113, 194, 0.55); }
  .sec-bar .name {
    margin-right: auto; padding: 4px 10px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.9); color: #1f2d3d;
  }
  .sec-bar button {
    width: 40px; height: 32px; font-size: 0.95rem; border-radius: 8px; cursor: pointer;
    border: 1px solid #b8c6d4; background: #fff; color: #1f2d3d;
  }
  .sec-bar button:disabled { opacity: 0.35; cursor: default; }
  main {
    width: 100%;
    max-width: 480px;
    padding: 24px 16px;
    flex: 1;
  }
  h1 { font-size: 1.5rem; text-align: center; margin: 0 0 20px; }
  /* 設定バー: スクロールしても、画面の上に残る。押すと、郵便番号・地域・日付の設定が、開閉する */
  /* バーと「今日」ボタンを横に並べる枠。この枠が、スクロールしても、画面の上に残る */
  .settings-wrap { position: sticky; top: 8px; z-index: 20; display: flex; gap: 8px; margin: 0 0 8px; }
  .settings-wrap[hidden], .today-btn[hidden] { display: none; }
  .today-btn {
    flex: none; padding: 0 14px; font: inherit; font-size: 0.85rem; font-weight: bold; white-space: nowrap;
    color: #fff; background: #1971c2; border: 1px solid #1971c2; border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); cursor: pointer;
  }
  .settings-bar {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 8px;
    margin: 0; padding: 10px 14px;
    font: inherit; font-size: 0.9rem; text-align: left; color: #1f2d3d;
    background: rgba(255, 255, 255, 0.92);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1px solid rgba(25, 113, 194, 0.25); border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); cursor: pointer;
  }
  .sb-place { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; }
  .sb-date { flex: none; white-space: nowrap; color: #5a6b7c; }
  .sb-toggle { flex: none; white-space: nowrap; color: #1971c2; font-size: 0.8rem; }
  .controls {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }
  label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 6px; }
  select, input[type="date"] {
    width: 100%;
    font-size: 1rem;
    padding: 10px;
    border: 1px solid #b8c6d4;
    border-radius: 8px;
    margin-bottom: 14px;
    background: #fff;
  }
  /* iPhone の Safari は、日付の入力欄が、指定した幅を無視して、中身の幅で広がる。はみ出さないよう、幅を固定する */
  input[type="date"] {
    display: block;
    min-width: 0;
    max-width: 100%;
    height: 44px; /* appearance を外すと高さがつぶれることがあるため。郵便番号欄と同じ高さ */
    -webkit-appearance: none;
    appearance: none;
    text-align: left;
  }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  .controls > :last-child { margin-bottom: 0; }
  .result {
    margin-top: 16px;
    background: #fff;
    border-radius: 12px;
    padding: 24px 16px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }
  .result .date { font-size: 0.95rem; color: #5a6b7c; }
  .result .weather { font-size: 2rem; font-weight: bold; margin: 8px 0 16px; }
  .temps { display: flex; justify-content: center; gap: 32px; }
  .temps div { font-size: 0.85rem; color: #5a6b7c; }
  .temps strong { display: block; font-size: 1.6rem; }
  .max strong { color: #d9480f; }
  .min strong { color: #1971c2; }
  .rain strong { color: #2b8a3e; }
  .rain strong.none { font-size: 1rem; color: #868e96; line-height: 2.4rem; }
  .message { color: #5a6b7c; }
  .error { color: #c92a2a; }
  .card {
    margin-top: 16px;
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }
  .card h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .card ul { margin: 0; padding-left: 1.2em; line-height: 1.8; }
  .note { font-size: 0.75rem; color: #868e96; margin: 10px 0 0; }
  .week-row {
    display: grid;
    grid-template-columns: 4.6em 1fr auto 3em;
    gap: 8px;
    align-items: center;
    padding: 8px 0;
    border-top: 1px solid #e9eef3;
    font-size: 0.9rem;
  }
  .week-row:first-of-type { border-top: none; }
  .week-row .wd { color: #5a6b7c; }
  .week-row .t-max { color: #d9480f; font-weight: bold; }
  .week-row .t-min { color: #1971c2; font-weight: bold; }
  .week-row .pop { text-align: right; color: #2b8a3e; }
  .zip-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .zip-row input {
    flex: 1; min-width: 0; font-size: 1rem; padding: 10px;
    border: 1px solid #b8c6d4; border-radius: 8px; background: #fff;
  }
  .zip-row button {
    font-size: 1rem; padding: 10px 16px; border: none; border-radius: 8px;
    background: #1971c2; color: #fff; cursor: pointer;
  }
  .zip-row button:disabled { background: #9bb7d4; cursor: default; }
  .default-row { margin: -4px 0 14px; }
  .default-btn {
    font-size: 0.85rem; padding: 6px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid #1971c2; background: #fff; color: #1971c2;
  }
  .default-btn.on { background: #1971c2; color: #fff; }
  .default-msg { font-size: 0.8rem; color: #5a6b7c; margin: 6px 0 0; min-height: 1.2em; }
  .zip-msg { font-size: 0.8rem; color: #5a6b7c; margin: 0 0 14px; min-height: 1.2em; }
  .zip-msg.err { color: #c92a2a; }
  .hours { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .hcell { border-radius: 8px; padding: 6px 0 5px; text-align: center; font-size: 0.7rem; line-height: 1.35; }
  .hcell .h-time { color: #5a6b7c; }
  .hcell .h-icon { font-size: 1.3rem; line-height: 1.5; }
  .hcell .h-temp { font-weight: bold; font-size: 0.8rem; }
  .hcell .h-pop { color: #2b8a3e; font-size: 0.68rem; }
  .hcell.past { opacity: 0.45; }
  .hcell.now { outline: 2px solid #1971c2; outline-offset: -1px; }
  .hc-sunny { background: #fff1b8; }
  .hc-partly { background: #e4f0fb; }
  .hc-cloudy { background: #e6eaee; }
  .hc-fog { background: #edeff1; }
  .hc-rain { background: #cde2fa; }
  .hc-snow { background: #e9f3ff; }
  .hc-storm { background: #d9d2ee; }
  .hday { font-weight: bold; margin: 12px 0 6px; font-size: 0.9rem; }
  .hday:first-of-type { margin-top: 0; }
  .insight { padding: 10px 0; border-top: 1px solid #e9eef3; }
  .insight:first-of-type { border-top: none; padding-top: 0; }
  .insight h3 { font-size: 0.95rem; margin: 0 0 6px; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 56px; margin: 8px 0 2px; }
  .bar { flex: 1; background: #4dabf7; border-radius: 2px 2px 0 0; min-height: 2px; }
  .bar.hot { background: #1971c2; }
  .bar.past { opacity: 0.35; }
  .bar-axis { display: flex; justify-content: space-between; font-size: 0.7rem; color: #868e96; }
  .verdict { font-weight: bold; color: #e8590c; }
  .day-block { margin-bottom: 14px; }
  .day-block:last-of-type { margin-bottom: 0; }
  .day-head { font-weight: bold; margin-bottom: 4px; }
  footer {
    font-size: 0.8rem;
    color: #1f2d3d;
    background: rgba(255, 255, 255, 0.86);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border-radius: 12px;
    padding: 10px 14px;
    margin: 8px 16px 130px; /* 下の余白は、固定の街並みの上に文字が来るようにするため */
    text-align: center;
  }
  footer a { color: #0b5cad; }
</style>
</head>
<body data-weather="default">
<div id="sky" aria-hidden="true"></div>
<div id="fx" aria-hidden="true"></div>
<main>
  <h1>お天気チェック</h1>
  <p class="greeting" id="greeting"></p>
  <div class="settings-wrap">
    <button id="settingsToggle" class="settings-bar" type="button" aria-expanded="true" aria-controls="settingsPanel">
      <span class="sb-place" id="sbPlace">📍 …</span>
      <span class="sb-date" id="sbDate"></span>
      <span class="sb-toggle"><span id="sbLabel">閉じる</span> <span id="sbChev" aria-hidden="true">▴</span></span>
    </button>
    <button id="todayBtn" class="today-btn" type="button" aria-label="今日の天気に戻る" hidden>↩ 今日</button>
  </div>
  <div class="controls" id="settingsPanel">
    <label for="zip">郵便番号で探す</label>
    <div class="zip-row">
      <input id="zip" type="text" inputmode="numeric" autocomplete="postal-code" placeholder="例: 1600023" maxlength="9">
      <button id="zipBtn" type="button">設定</button>
    </div>
    <p class="zip-msg" id="zipMsg"></p>
    <label for="region">地域</label>
    <select id="region"></select>
    <div class="default-row">
      <button id="defBtn" type="button" class="default-btn"></button>
      <p class="default-msg" id="defMsg"></p>
    </div>
    <label for="date">日付</label>
    <input type="date" id="date">
  </div>
  <div class="edit-row">
    <button id="editBtn" type="button" class="edit-btn" aria-pressed="false">⇅ 並び替え</button>
    <button id="resetOrderBtn" type="button" class="edit-btn" hidden>元の順番に戻す</button>
  </div>
  <div id="sections">
    <section class="sec" data-id="result">
      <div class="result" id="result">
        <p class="message">地域と日付を選んでください。</p>
      </div>
    </section>
    <section class="sec" data-id="hourly">
      <div class="card" id="hourly">
        <h2>🕒 今日・明日の時間ごとの天気</h2>
        <p class="message">読み込み中…</p>
      </div>
    </section>
    <section class="sec" data-id="insights">
      <div class="card" id="insights" hidden>
        <h2 id="insightsTitle">📌 選んだ日の詳細</h2>
        <div class="insight" id="rainBlock"></div>
        <div class="insight" id="compareBlock"></div>
        <div class="insight" id="verifyBlock"></div>
      </div>
    </section>
    <section class="sec" data-id="outfit">
      <div class="card" id="outfit" hidden></div>
    </section>
    <section class="sec" data-id="week">
      <div class="card" id="week">
        <h2>1週間の予報</h2>
        <p class="message">読み込み中…</p>
      </div>
    </section>
  </div>
</main>
<footer>
  天気データ: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>（<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>）<br>

</footer>

  // 天気コード（WMO）を日本語に変換
  function weatherText(code) {
    if (code === 0) return "☀️ 快晴";
    if (code === 1) return "🌤 晴れ";
    if (code === 2) return "⛅ 晴れ時々くもり";
    if (code === 3) return "☁️ くもり";
    if (code === 45 || code === 48) return "🌫 霧";
    if (code >= 51 && code <= 57) return "🌦 霧雨";
    if (code >= 61 && code <= 67) return "🌧 雨";
    if (code >= 71 && code <= 77) return "❄️ 雪";
    if (code >= 80 && code <= 82) return "🌧 にわか雨";
    if (code === 85 || code === 86) return "❄️ にわか雪";
    if (code === 95) return "⛈ 雷雨";
    if (code === 96 || code === 99) return "⛈ 雷雨（ひょうを伴う）";
    if (code === 97) return "⛈ 激しい雷雨";
    return "不明（コード " + code + "）";
  }

  const regionEl = document.getElementById("region");
  const dateEl = document.getElementById("date");

  // 地域の記憶（ブラウザに保存。使えない環境では記憶しないだけで、動作には影響しない）
  const LOC_KEY = "weather-practice:loc";
  let customLoc = null; // 郵便番号から決めた地点 { name, lat, lon }

  function esc(t) {
    return String(t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function currentRegion() {
    return regionEl.value === "custom" ? customLoc : REGIONS[Number(regionEl.value)];
  }
  function saveLoc() {
    try { localStorage.setItem(LOC_KEY, JSON.stringify({ sel: regionEl.value, custom: customLoc })); } catch (e) { /* 何もしない */ }
  }
  function validCustom(c) {
    return !!c && typeof c.name === "string" && c.name.length < 100 && Number.isFinite(c.lat) && Number.isFinite(c.lon);
  }
  function validSel(sel, custom) {
    if (sel === "custom") return validCustom(custom);
    return Number.isInteger(Number(sel)) && Number(sel) >= 0 && Number(sel) < REGIONS.length;
  }

  // デフォルトの地域（「いつもの地域」。設定すると、開いたときに必ずこの地域から始まる）
  const DEF_KEY = "weather-practice:default";
  let defaultLoc = null; // { sel, custom }
  try {
    const v = JSON.parse(localStorage.getItem(DEF_KEY));
    if (v && validSel(v.sel, v.custom)) defaultLoc = { sel: String(v.sel), custom: v.sel === "custom" ? v.custom : null };
  } catch (e) { /* 読めなければデフォルトなし */ }

  const defBtn = document.getElementById("defBtn");
  const defMsg = document.getElementById("defMsg");
  function isDefaultCustom(c) {
    return !!defaultLoc && defaultLoc.sel === "custom" && !!c
      && defaultLoc.custom.lat === c.lat && defaultLoc.custom.lon === c.lon;
  }
  function isCurrentDefault() {
    if (!defaultLoc) return false;
    return regionEl.value === "custom" ? isDefaultCustom(customLoc) : defaultLoc.sel === regionEl.value;
  }
  // 一覧の「★」とボタンの表示を、いまの状態に合わせる
  function refreshDefaultUi() {
    Array.prototype.forEach.call(regionEl.options, function (opt) {
      if (opt.value === "custom") {
        opt.textContent = (isDefaultCustom(customLoc) ? "★ " : "") + "📍 " + customLoc.name;
      } else {
        const i = Number(opt.value);
        opt.textContent = (defaultLoc && defaultLoc.sel === opt.value ? "★ " : "") + REGIONS[i].name;
      }
    });
    const on = isCurrentDefault();
    defBtn.textContent = on ? "★ デフォルトに設定中（解除する）" : "☆ この地域をデフォルトにする";
    defBtn.className = "default-btn" + (on ? " on" : "");
  }
  defBtn.addEventListener("click", function () {
    let saved = true;
    if (isCurrentDefault()) {
      defaultLoc = null;
      try { localStorage.removeItem(DEF_KEY); } catch (e) { saved = false; }
      defMsg.textContent = "デフォルトを解除しました。次回からは、最後に見た地域が最初に出ます。";
    } else {
      defaultLoc = { sel: regionEl.value, custom: regionEl.value === "custom" ? { name: customLoc.name, lat: customLoc.lat, lon: customLoc.lon } : null };
      try { localStorage.setItem(DEF_KEY, JSON.stringify(defaultLoc)); } catch (e) { saved = false; }
      defMsg.textContent = "デフォルトに設定しました。次回から、開くとこの地域が最初に出ます。";
    }
    if (!saved) defMsg.textContent += "（このブラウザでは保存できないため、次回は反映されません）";
    refreshDefaultUi();
  });

  function setCustom(loc) {
    customLoc = loc;
    let opt = regionEl.querySelector('option[value="custom"]');
    if (!opt) {
      opt = document.createElement("option");
      opt.value = "custom";
      regionEl.insertBefore(opt, regionEl.firstChild);
    }
    regionEl.value = "custom";
    refreshDefaultUi();
  }
  (function restoreLoc() {
    // デフォルトがあれば、それを最初に表示する。無ければ、最後に見た地域
    if (defaultLoc) {
      if (defaultLoc.sel === "custom") setCustom(defaultLoc.custom);
      else regionEl.value = defaultLoc.sel;
      return;
    }
    try {
      const v = JSON.parse(localStorage.getItem(LOC_KEY));
      if (!v) return;
      if (validCustom(v.custom)) setCustom(v.custom);
      if (v.sel === "custom" && customLoc) regionEl.value = "custom";
      else if (validSel(v.sel, null)) regionEl.value = String(Number(v.sel));
    } catch (e) { /* 読めなければ初期値のまま */ }
  })();
  refreshDefaultUi();

  function toYMD(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  // 選べる日付: 今日の92日前から、予報APIが返せる最終日（今日を含めて16日間＝15日後）まで
  const today = new Date();
  const minDate = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 92);
  const maxDate = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 15);
  dateEl.min = toYMD(minDate);
  dateEl.max = toYMD(maxDate);
  dateEl.value = toYMD(today);

  function show(html) { resultEl.innerHTML = html; }

  const todayStr = toYMD(today);
  const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

  function ymdLabel(ymd) {
    const p = ymd.split("-");
    const dt = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return Number(p[1]) + "/" + Number(p[2]) + "(" + WEEKDAYS[dt.getDay()] + ")";
  }

  // 雨・雪の天気コードか
  function isRainy(code) {
    return (code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95;
  }
  function isSnowy(code) {
    return (code >= 71 && code <= 77) || code === 85 || code === 86;
  }

  // おすすめの服装（最高・最低気温、降水確率、天気コードから決める）
  function outfitAdvice(max, min, rain, code) {
    const items = [];
    if (max >= 30) items.push("半袖・薄手のワンピースなど、涼しい服装。帽子と水分補給も忘れずに");
    else if (max >= 25) items.push("半袖で過ごせる暖かさ。日差し対策に薄手の羽織りがあると安心");
    else if (max >= 20) items.push("長袖シャツや薄手のカーディガンがちょうどいい暖かさ");
    else if (max >= 15) items.push("薄手のセーターやパーカーに、軽めの上着を");
    else if (max >= 10) items.push("厚手のニットに、コートやジャケットを");
    else if (max >= 5) items.push("冬用のコートに、マフラーや手袋を");
    else items.push("ダウンなどの防寒着に、マフラー・手袋・ニット帽を");

    if (min <= 12 && max >= 20) items.push("朝晩は冷えるので、脱ぎ着しやすい上着を持っていくと◎");
    else if (max - min >= 10) items.push("昼と朝晩の気温差が大きいので、重ね着で調整を");

    if (isSnowy(code)) items.push("雪の予報。滑りにくい靴と、防寒・防水の備えを");
    else if (rain !== null && rain >= 50) items.push("雨の可能性が高いので、傘と濡れても困らない靴を");
    else if (isRainy(code)) items.push("雨の予報なので、傘があると安心");
    else if (rain !== null && rain >= 30) items.push("降るかもしれないので、折りたたみ傘があると安心");
    return items;
  }

  const outfitEl = document.getElementById("outfit");
  const weekEl = document.getElementById("week");

  // 今日・明日のおすすめの服装（1週間の予報のデータを使う）
  function renderOutfit(d) {
    let body = "";
    [["今日", 0], ["明日", 1]].forEach(function (pair) {
      const i = pair[1];
      const rain = d.precipitation_probability_max[i];
      const items = outfitAdvice(
        d.temperature_2m_max[i], d.temperature_2m_min[i],
        (rain === null || rain === undefined) ? null : rain, d.weather_code[i]
      );
      body += '<div class="day-block"><div class="day-head">' + pair[0] + "（" + ymdLabel(d.time[i]) + "）</div><ul>"
        + items.map(function (t) { return "<li>" + t + "</li>"; }).join("")
        + "</ul></div>";
    });
    outfitEl.innerHTML = "<h2>👕 今日・明日のおすすめの服装</h2>" + body
      + '<p class="note">※ 選んだ地域の気温・降水確率から決めています。</p>';
    outfitEl.hidden = false;
  }

  // ---- データ取得 ----
  const FORECAST = "https://api.open-meteo.com/v1/forecast";
  const ARCHIVE = "https://archive-api.open-meteo.com/v1/archive";
  const PREVRUNS = "https://previous-runs-api.open-meteo.com/v1/forecast";

  async function getJson(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }
  function addDays(ymd, n) {
    const p = ymd.split("-").map(Number);
    return toYMD(new Date(p[0], p[1] - 1, p[2] + n));
  }
  function addYears(ymd, n) {
    const p = ymd.split("-").map(Number);
    const d = new Date(p[0] + n, p[1] - 1, p[2]);
    if (d.getMonth() !== p[1] - 1) d.setDate(0); // うるう日は前日に寄せる
    return toYMD(d);
  }
  function loc(region) { return "latitude=" + region.lat + "&longitude=" + region.lon; }
  // 予報APIが受け付けるのは、およそ92日前まで。それより前は過去データAPIだけを使う
  function tooOldForForecast(date) { return date < addDays(todayStr, -92); }

  // 1日分の天気。予報API → 空なら過去データAPI。降水確率は予報APIだけにある
  async function getDaily(region, date) {
    const daily = "&daily=weather_code,temperature_2m_max,temperature_2m_min";
    const tail = "&timezone=Asia%2FTokyo&start_date=" + date + "&end_date=" + date;
    let d = null;
    let rain = null;
    if (!tooOldForForecast(date)) {
      d = (await getJson(FORECAST + "?" + loc(region) + daily + ",precipitation_probability_max" + tail)).daily;
      // 古い日付は天気が空でも、降水確率だけは返ることがある。過去データAPIに切り替えても、これは使う
      if (d && d.precipitation_probability_max) rain = d.precipitation_probability_max[0];
    }
    if (!d || d.weather_code[0] === null) {
      d = (await getJson(ARCHIVE + "?" + loc(region) + daily + tail)).daily;
    }
    if (!d || !d.time || d.time.length === 0 || d.weather_code[0] === null) return null;
    return {
      date: d.time[0], code: d.weather_code[0],
      max: d.temperature_2m_max[0], min: d.temperature_2m_min[0],
      rain: (rain === undefined ? null : rain)
    };
  }

  // 値が true の連続した時間を「15時〜18時」の形にまとめる
  function hourRanges(flags) {
    const out = [];
    let start = null;
    for (let h = 0; h <= 24; h++) {
      const on = h < 24 && flags[h];
      if (on && start === null) start = h;
      if (!on && start !== null) { out.push(start + "時〜" + h + "時"); start = null; }
    }
    return out;
  }
  function bars(values, scaleMax, hotFn, pastHours) {
    let html = '<div class="bars">';
    for (let h = 0; h < 24; h++) {
      const v = values[h];
      const pct = (v === null || v === undefined) ? 2 : Math.max(2, Math.min(100, (v / scaleMax) * 100));
      html += '<div class="bar' + (hotFn(v) ? " hot" : "") + (h < pastHours ? " past" : "")
        + '" style="height:' + pct + '%" title="' + h + '時"></div>';
    }
    return html + '</div><div class="bar-axis"><span>0時</span><span>6時</span><span>12時</span><span>18時</span><span>24時</span></div>';
  }

  // 雨の時間帯
  async function renderRainBlock(my, region, date) {
    const el = document.getElementById("rainBlock");
    try {
      let html;
      if (date >= todayStr) {
        const j = await getJson(FORECAST + "?" + loc(region) + "&hourly=precipitation_probability&timezone=Asia%2FTokyo&start_date=" + date + "&end_date=" + date);
        const p = j.hourly.precipitation_probability;
        const nowH = date === todayStr ? new Date().getHours() : 0;
        const future = p.map(function (v, h) { return h >= nowH ? v : null; });
        const known = future.filter(function (v) { return v !== null && v !== undefined; });
        if (known.length === 0) {
          html = "<h3>☂️ 雨の時間帯</h3><div>この日の1時間ごとのデータはありません。</div>";
        } else {
          const ranges = hourRanges(future.map(function (v) { return v !== null && v >= 50; }));
          const peak = Math.max.apply(null, known);
          const peakH = future.indexOf(peak);
          let line;
          if (ranges.length) line = "☂️ 傘が要りそうな時間: <strong>" + ranges.join("、") + "</strong>";
          else if (peak >= 30) line = "🌂 降る可能性は低めですが、" + peakH + "時ごろに" + Math.round(peak) + "%。折りたたみ傘があると安心です";
          else line = "🌞 " + (date === todayStr ? "今日はこれから、" : "") + "傘はいらなさそうです";
          if (peak < 20) {
            // 雨の心配がほとんどない日は、平らな棒が並ぶだけで、何のグラフかわかりにくい。グラフは出さず、言葉だけで伝える
            html = "<h3>☂️ 雨の時間帯</h3><div>" + line + "</div>"
              + '<p class="note">降水確率は、' + (date === todayStr ? "この先、" : "1日を通して、") + "最大 " + Math.round(peak) + "% です。</p>";
          } else {
            html = "<h3>☂️ 雨の時間帯（降水確率）</h3><div>" + line + "</div>"
              + bars(p, 100, function (v) { return v !== null && v >= 50; }, nowH)
              + '<p class="note">棒の高さは、1時間ごとの降水確率です。濃い青は、50%以上の時間です。</p>';
          }
        }
      } else {
        let j = null;
        if (!tooOldForForecast(date)) {
          j = await getJson(FORECAST + "?" + loc(region) + "&hourly=precipitation&timezone=Asia%2FTokyo&start_date=" + date + "&end_date=" + date);
        }
        if (!j || j.hourly.precipitation.every(function (v) { return v === null; })) {
          j = await getJson(ARCHIVE + "?" + loc(region) + "&hourly=precipitation&timezone=Asia%2FTokyo&start_date=" + date + "&end_date=" + date);
        }
        const mm = j.hourly.precipitation;
        if (mm.every(function (v) { return v === null; })) {
          html = "<h3>☂️ 雨の時間帯</h3><div>この日のデータはありません。</div>";
        } else {
          const total = mm.reduce(function (a, v) { return a + (v || 0); }, 0);
          const ranges = hourRanges(mm.map(function (v) { return v !== null && v >= 0.5; }));
          const line = ranges.length
            ? "☔ 雨が降っていた時間: <strong>" + ranges.join("、") + "</strong>（1日の合計 " + total.toFixed(1) + "mm）"
            : "☀️ まとまった雨は降っていませんでした（1日の合計 " + total.toFixed(1) + "mm）";
          if (!ranges.length) {
            // 雨が降っていない日は、グラフを出さず、言葉だけで伝える
            html = "<h3>☂️ 雨の時間帯</h3><div>" + line + "</div>";
          } else {
            html = "<h3>☂️ 雨の時間帯（降水量）</h3><div>" + line + "</div>"
              + bars(mm, 5, function (v) { return v !== null && v >= 0.5; }, 0)
              + '<p class="note">棒の高さは、1時間ごとの降水量です(5mmで最大)。濃い青は、0.5mm以上の時間です。</p>';
          }
        }
      }
      if (my === seq) el.innerHTML = html;
    } catch (e) {
      if (my === seq) el.innerHTML = '<h3>☂️ 雨の時間帯</h3><div class="error">取得できませんでした。（' + esc(e.message) + "）</div>";
    }
  }

  // 前日・去年の同じ日との比べ
  function diffText(label, a, b) {
    const r = Math.round(a) - Math.round(b);
    return r === 0 ? label + "は同じ" : label + "が " + Math.abs(r) + "℃ " + (r > 0 ? "高い" : "低い");
  }
  async function renderCompareBlock(my, region, date, d) {
    const el = document.getElementById("compareBlock");
    try {
      const results = await Promise.all([
        getDaily(region, addDays(date, -1)).catch(function () { return null; }),
        getDaily(region, addYears(date, -1)).catch(function () { return null; })
      ]);
      const prev = results[0], last = results[1];
      let items = "";
      if (prev) {
        items += "<li>前日（" + ymdLabel(prev.date) + "）より、" + diffText("最高気温", d.max, prev.max)
          + "、" + diffText("最低気温", d.min, prev.min) + "（前日は " + weatherText(prev.code) + "）</li>";
      }
      if (last) {
        items += "<li>去年の同じ日（" + last.date + "）は " + weatherText(last.code) + "、最高 " + Math.round(last.max)
          + "℃ / 最低 " + Math.round(last.min) + "℃。今年は" + diffText("最高気温", d.max, last.max) + "</li>";
      }
      if (my === seq) {
        el.innerHTML = "<h3>📊 前日・去年との比べ</h3>"
          + (items ? "<ul>" + items + "</ul>" : "<div>比べるデータが取れませんでした。</div>");
      }
    } catch (e) {
      if (my === seq) el.innerHTML = '<h3>📊 前日・去年との比べ</h3><div class="error">取得できませんでした。</div>';
    }
  }

  // 予報の答え合わせ（前日に出ていた予報と、実際の天気を比べる）
  async function renderVerifyBlock(my, region, date) {
    const el = document.getElementById("verifyBlock");
    if (date > todayStr) { el.innerHTML = ""; return; }
    if (date === todayStr) {
      el.innerHTML = "<h3>🎯 予報の答え合わせ</h3><div>今日の分は、明日になると見られます。</div>";
      return;
    }
    try {
      const j = await getJson(PREVRUNS + "?" + loc(region)
        + "&hourly=temperature_2m,temperature_2m_previous_day1,precipitation,precipitation_previous_day1"
        + "&timezone=Asia%2FTokyo&start_date=" + date + "&end_date=" + date);
      const h = j.hourly;
      function nums(a) { return a.filter(function (v) { return v !== null && v !== undefined; }); }
      const aT = nums(h.temperature_2m), fT = nums(h.temperature_2m_previous_day1);
      const aR = nums(h.precipitation), fR = nums(h.precipitation_previous_day1);
      if (aT.length < 20 || fT.length < 20 || aR.length < 20 || fR.length < 20) {
        if (my === seq) el.innerHTML = "<h3>🎯 予報の答え合わせ</h3><div>この日の答え合わせに使えるデータがありません。</div>";
        return;
      }
      const sum = function (a) { return a.reduce(function (x, v) { return x + v; }, 0); };
      const aMax = Math.max.apply(null, aT), fMax = Math.max.apply(null, fT);
      const aRain = sum(aR), fRain = sum(fR);
      const aWet = aRain >= 1, fWet = fRain >= 1;
      const gap = Math.abs(Math.round(aMax) - Math.round(fMax));
      let verdict;
      if (aWet === fWet && gap <= 2) verdict = "◎ ほぼ的中";
      else if (aWet === fWet && gap <= 4) verdict = "○ まずまず";
      else verdict = "△ ずれがありました";
      const rainTxt = function (wet, mm) { return wet ? "雨あり（" + mm.toFixed(1) + "mm）" : "雨なし"; };
      if (my === seq) {
        el.innerHTML = "<h3>🎯 予報の答え合わせ</h3>"
          + "<div>前日の予報: 最高 " + Math.round(fMax) + "℃・" + rainTxt(fWet, fRain) + "</div>"
          + "<div>実際: 最高 " + Math.round(aMax) + "℃・" + rainTxt(aWet, aRain) + "</div>"
          + '<div class="verdict">' + verdict + "</div>"
          + '<p class="note">雨あり＝1日の合計が1mm以上。「実際」は予報モデルの解析値で、上の降水量と少し違う場合があります。</p>';
      }
    } catch (e) {
      if (my === seq) el.innerHTML = '<h3>🎯 予報の答え合わせ</h3><div class="error">取得できませんでした。</div>';
    }
  }

  // ---- 1週間の予報（今日から7日間。選んだ地域に合わせる）----
  let weekSeq = 0;
  async function updateWeek() {
    const my = ++weekSeq;
    const region = currentRegion();
    weekEl.innerHTML = '<h2>1週間の予報</h2><p class="message">読み込み中…</p>';
    try {
      const d = (await getJson(FORECAST + "?" + loc(region)
        + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
        + "&timezone=Asia%2FTokyo&forecast_days=7")).daily;
      if (my !== weekSeq) return;
      let rows = "";
      for (let i = 0; i < d.time.length; i++) {
        const pop = d.precipitation_probability_max[i];
        rows += '<div class="week-row">'
          + '<div class="wd">' + ymdLabel(d.time[i]) + "</div>"
          + "<div>" + weatherText(d.weather_code[i]) + "</div>"
          + '<div><span class="t-max">' + Math.round(d.temperature_2m_max[i]) + '℃</span> / <span class="t-min">'
          + Math.round(d.temperature_2m_min[i]) + "℃</span></div>"
          + '<div class="pop">' + (pop === null || pop === undefined ? "-" : Math.round(pop) + "%") + "</div>"
          + "</div>";
      }
      renderOutfit(d);
      weekEl.innerHTML = "<h2>1週間の予報（" + esc(region.name) + "）</h2>" + rows
        + '<p class="note">右端は降水確率です。</p>';
    } catch (e) {
      if (my !== weekSeq) return;
      outfitEl.hidden = true;
      weekEl.innerHTML = '<h2>1週間の予報</h2><p class="error">取得できませんでした。（' + esc(e.message) + "）</p>";
    }
  }

  // ---- 天気・時間帯・季節に合わせた背景 ----
  const PHASE_TOP = { dawn: "#34336b", sunset: "#2f2a63", night: "#070b22" };
  const THEME_TOP = { default: "#d6e9f8", sunny: "#3d9be9", partly: "#6fb1e6", cloudy: "#aab5c2", fog: "#c9ced3", rain: "#2f3d52", snow: "#9db9d6", storm: "#221f38" };
  const fxEl = document.getElementById("fx");
  const skyEl = document.getElementById("sky");
  const greetingEl = document.getElementById("greeting");
  const themeColorEl = document.querySelector('meta[name="theme-color"]');
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let currentTheme = "default";
  let currentPhase = "";
  let rainbowOn = false;

  function themeFor(code) {
    if (code === 0 || code === 1) return "sunny";
    if (code === 2) return "partly";
    if (code === 45 || code === 48) return "fog";
    if (isSnowy(code)) return "snow";
    if (code >= 95) return "storm";
    if (isRainy(code)) return "rain";
    return "cloudy";
  }
  function rnd(a, b) { return a + Math.random() * (b - a); }

  // 時間帯: 夜 19〜5時 / 朝焼け 5〜7時 / 昼 7〜16時 / 夕焼け 16〜19時
  function phaseOf(hour) {
    if (hour >= 19 || hour < 5) return "night";
    if (hour < 7) return "dawn";
    if (hour < 16) return "day";
    return "sunset";
  }
  // 月の満ち欠け（目安。月齢から8段階の絵文字にする）
  const MOONS = ["🌑", "🌒", "🌓", "🌔", "🌕", "🌖", "🌗", "🌘"];
  function moonInfo(date) {
    const jd = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 12) / 86400000 + 2440587.5;
    const age = (((jd - 2451550.1) % 29.530588853) + 29.530588853) % 29.530588853;
    return { emoji: MOONS[Math.floor((age / 29.530588853) * 8 + 0.5) % 8], age: Math.round(age) };
  }

  function updateGreeting() {
    const now = new Date();
    const h = now.getHours();
    const hello = (h >= 5 && h < 10) ? "おはようございます" : (h >= 10 && h < 17) ? "こんにちは" : "こんばんは";
    let text = hello + "｜" + (now.getMonth() + 1) + "月" + now.getDate() + "日（" + WEEKDAYS[now.getDay()] + "）";
    if (currentPhase === "night") {
      const m = moonInfo(now);
      text += "｜今夜の月 " + m.emoji + "（月齢 " + m.age + "）";
    }
    greetingEl.textContent = text;
  }

  // 太陽・月が空を動く位置（時刻から決める）
  function orbPosition(now) {
    const t = now.getHours() + now.getMinutes() / 60;
    const night = currentPhase === "night";
    const raw = night ? ((t >= 19 ? t - 19 : t + 5) / 10) : (t - 5) / 14;
    const p = Math.min(1, Math.max(0, raw));
    return { left: 8 + 84 * p, top: 62 - 52 * Math.sin(Math.PI * p) };
  }
  function positionOrb() {
    const orb = skyEl.querySelector(".orb");
    if (!orb) return;
    const pos = orbPosition(new Date());
    orb.style.left = pos.left.toFixed(1) + "%";
    orb.style.top = pos.top.toFixed(1) + "%";
  }

  // 街の景色（富士山と街並み）。夜は窓に灯りがつく
  const BUILDINGS = [[0,24,40],[24,18,58],[42,26,34],[68,16,70],[84,28,46],[112,20,30],[132,22,62],[154,30,40],[184,16,76],[200,26,36],[226,22,54],[248,28,44],[276,18,66],[294,24,32],[318,20,52],[338,26,40],[364,36,48]];
  const LAND = {
    day: { land: "#33485f", fuji: "#7f9bbb", win: 0 },
    dawn: { land: "#2d2a50", fuji: "#7d5a8c", win: 0.35 },
    sunset: { land: "#2a1f3d", fuji: "#7a4f78", win: 0.55 },
    night: { land: "#060a1c", fuji: "#1a2547", win: 0.95 }
  };
  function landscapeSvg(phase) {
    const c = LAND[phase];
    let svg = '<svg class="land" viewBox="0 0 400 100" preserveAspectRatio="xMidYMax slice">'
      + '<polygon points="140,100 250,26 360,100" fill="' + c.fuji + '"/>'
      + '<polygon points="250,26 238,41 244,38 250,45 256,38 262,41" fill="#fff" opacity="0.9"/>';
    BUILDINGS.forEach(function (b) {
      svg += '<rect x="' + b[0] + '" y="' + (100 - b[2]) + '" width="' + b[1] + '" height="' + b[2] + '" fill="' + c.land + '"/>';
      if (c.win > 0) {
        const cols = Math.floor((b[1] - 6) / 6), rows = Math.floor((b[2] - 8) / 8);
        for (let i = 0; i < cols; i++) {
          for (let j = 0; j < rows; j++) {
            if ((i * 7 + j * 13 + b[0]) % 3 === 0) continue;
            svg += '<rect x="' + (b[0] + 4 + i * 6) + '" y="' + (100 - b[2] + 5 + j * 8) + '" width="3" height="4" fill="#ffd86b" opacity="' + c.win + '"/>';
          }
        }
      }
    });
    return svg + "</svg>";
  }
  function rainbowSvg() {
    const colors = ["#ff5a5a", "#ff9f43", "#ffe066", "#69db7c", "#4dabf7", "#5c7cfa", "#9775fa"];
    let svg = '<svg class="rainbow" viewBox="0 0 200 100" preserveAspectRatio="none">';
    colors.forEach(function (col, i) {
      const r = 96 - i * 4;
      svg += '<path d="M ' + (100 - r) + ' 100 A ' + r + ' ' + r + ' 0 0 1 ' + (100 + r) + ' 100" fill="none" stroke="' + col + '" stroke-width="4"/>';
    });
    return svg + "</svg>";
  }

  // 天気ごとの雲の数と色、時間帯ごとの空の暗さ
  const CLOUDS = { default: 2, sunny: 2, partly: 4, cloudy: 6, fog: 4, rain: 6, snow: 5, storm: 6 };
  function cloudColor(theme, phase) {
    if (phase === "night") return "rgba(150, 165, 205, 0.28)";
    if (phase === "dawn" || phase === "sunset") return "rgba(255, 226, 215, 0.5)";
    if (theme === "storm") return "rgba(120, 110, 160, 0.4)";
    if (theme === "rain") return "rgba(170, 185, 205, 0.32)";
    if (theme === "cloudy") return "rgba(255, 255, 255, 0.6)";
    return "rgba(255, 255, 255, 0.82)";
  }
  const OVERLAY = {
    default: "transparent", sunny: "transparent", partly: "rgba(150, 160, 170, 0.18)", cloudy: "rgba(120, 130, 140, 0.4)",
    fog: "rgba(190, 195, 200, 0.45)", rain: "rgba(40, 55, 75, 0.5)", snow: "rgba(230, 240, 250, 0.3)", storm: "rgba(25, 20, 45, 0.6)"
  };

  function buildSky(theme, phase) {
    skyEl.className = reduceMotion ? "still" : "";
    let html = "";
    const clear = (theme === "sunny" || theme === "partly" || theme === "default");
    const precip = (theme === "rain" || theme === "storm" || theme === "snow");

    // 星と流れ星（夜）
    if (phase === "night" && (clear || theme === "cloudy" || theme === "fog")) {
      const n = clear ? (theme === "sunny" ? 60 : 40) : 14;
      for (let i = 0; i < n; i++) {
        html += '<span class="star" style="left:' + rnd(0, 100).toFixed(1) + '%;top:' + rnd(0, 62).toFixed(1) + '%;animation-delay:-' + rnd(0, 3).toFixed(1) + 's"></span>';
      }
      if (clear) html += '<span class="meteor"></span>';
    }
    // 太陽・月
    if (!precip) {
      const opacity = clear ? 1 : (theme === "cloudy" ? 0.35 : 0.25);
      const orbClass = phase === "night" ? "orb moon" : "orb sun";
      const inner = phase === "night" ? moonInfo(new Date()).emoji : "";
      html += '<div class="' + orbClass + '" style="opacity:' + opacity + '">' + inner + "</div>";
    }
    // 雲
    const color = cloudColor(theme, phase);
    for (let i = 0; i < CLOUDS[theme]; i++) {
      const w = rnd(110, 220).toFixed(0);
      const dur = rnd(70, 140).toFixed(0);
      html += '<div class="cloud" style="--w:' + w + 'px;--h:' + (w * 0.22).toFixed(0) + 'px;--dur:' + dur + 's;--delay:-' + rnd(0, dur).toFixed(0)
        + 's;top:' + rnd(3, 38).toFixed(1) + '%;background:' + color + (reduceMotion ? ";left:" + rnd(0, 80).toFixed(0) + "%" : "") + '"></div>';
    }
    // 虹（雨上がりの昼）
    if (rainbowOn && phase === "day" && !precip) html += rainbowSvg();
    // 季節の舞いもの（雨・雪・雷雨のときは出さない）
    if (!precip) {
      const month = new Date().getMonth() + 1;
      let glyphs = null;
      if (month === 3 || month === 4) glyphs = ["🌸"];
      else if (month === 5) glyphs = ["🍃"];
      else if (month >= 9 && month <= 11) glyphs = ["🍂", "🍁"];
      if (glyphs) {
        for (let i = 0; i < 12; i++) {
          html += '<span class="leaf" style="left:' + rnd(0, 100).toFixed(1) + '%;--fs:' + rnd(14, 24).toFixed(0) + 'px;--dur:' + rnd(10, 18).toFixed(1)
            + 's;--delay:-' + rnd(0, 18).toFixed(1) + 's;--dx:' + rnd(-90, 90).toFixed(0) + 'px;--rot:' + rnd(-360, 360).toFixed(0) + 'deg">'
            + glyphs[i % glyphs.length] + "</span>";
        }
      } else if ((month === 7 || month === 8) && phase === "night") {
        for (let i = 0; i < 14; i++) {
          html += '<span class="firefly" style="left:' + rnd(0, 100).toFixed(1) + '%;top:' + rnd(55, 85).toFixed(1) + '%;--dur:' + rnd(4, 8).toFixed(1)
            + 's;--delay:-' + rnd(0, 8).toFixed(1) + 's;--dx:' + rnd(-40, 40).toFixed(0) + 'px;--dy:' + rnd(-50, 20).toFixed(0) + 'px"></span>';
        }
      } else if ((month === 12 || month <= 2) && phase === "day") {
        for (let i = 0; i < 18; i++) {
          html += '<span class="star w" style="left:' + rnd(0, 100).toFixed(1) + '%;top:' + rnd(5, 70).toFixed(1) + '%;animation-delay:-' + rnd(0, 3).toFixed(1) + 's"></span>';
        }
      }
    }
    html += landscapeSvg(phase);
    skyEl.innerHTML = '<div class="wx-overlay"></div>' + html;
    skyEl.style.setProperty("--overlay", phase === "day" ? "transparent" : OVERLAY[theme]);
    positionOrb();
  }

  function buildFx(theme) {
    fxEl.innerHTML = "";
    if (reduceMotion) return;
    let html = "";
    if (theme === "rain" || theme === "storm") {
      const n = theme === "storm" ? 70 : 45;
      for (let i = 0; i < n; i++) {
        html += '<span class="drop" style="left:' + rnd(0, 105).toFixed(1) + '%;animation-duration:' + rnd(0.6, 1.1).toFixed(2)
          + 's;animation-delay:-' + rnd(0, 1.2).toFixed(2) + 's"></span>';
      }
    } else if (theme === "snow") {
      for (let i = 0; i < 40; i++) {
        const size = rnd(3, 7).toFixed(1);
        html += '<span class="flake" style="left:' + rnd(0, 100).toFixed(1) + '%;--s:' + size + 'px;--dx:' + rnd(-40, 40).toFixed(0)
          + 'px;animation-duration:' + rnd(6, 12).toFixed(1) + 's;animation-delay:-' + rnd(0, 12).toFixed(1) + 's"></span>';
      }
    }
    fxEl.innerHTML = html;
  }

  // 背景を作り直す（天気・時間帯・虹が変わったとき）。force=false で時間帯が同じなら、太陽・月の位置と挨拶だけ更新する
  function refreshScene(force) {
    const phase = phaseOf(new Date().getHours());
    if (!force && phase === currentPhase) { positionOrb(); updateGreeting(); return; }
    const themeChanged = document.body.dataset.weather !== currentTheme;
    currentPhase = phase;
    document.body.dataset.phase = phase;
    document.body.dataset.weather = currentTheme;
    const topColor = phase === "day" ? THEME_TOP[currentTheme] : PHASE_TOP[phase];
    if (themeColorEl) themeColorEl.setAttribute("content", topColor);
    document.documentElement.style.backgroundColor = topColor;
    buildSky(currentTheme, phase);
    if (force || themeChanged) buildFx(currentTheme);
    updateGreeting();
  }
  function applyTheme(code) {
    const theme = (code === null || code === undefined) ? "default" : themeFor(code);
    if (theme === currentTheme && currentPhase) return;
    currentTheme = theme;
    refreshScene(true);
  }
  function setRainbow(on) {
    if (on === rainbowOn) return;
    rainbowOn = on;
    if (currentPhase) refreshScene(true);
  }

  // ---- 今日・明日の時間ごとの天気（3時間ごと。選んだ地域に合わせる）----
  let hourSeq = 0;
  async function updateHourly() {
    const my = ++hourSeq;
    const region = currentRegion();
    const el = document.getElementById("hourly");
    el.innerHTML = '<h2>🕒 今日・明日の時間ごとの天気</h2><p class="message">読み込み中…</p>';
    try {
      const t0 = todayStr, t1 = addDays(todayStr, 1);
      const j = await getJson(FORECAST + "?" + loc(region)
        + "&hourly=weather_code,temperature_2m,precipitation_probability&timezone=Asia%2FTokyo&start_date=" + t0 + "&end_date=" + t1);
      if (my !== hourSeq) return;
      const h = j.hourly;
      const nowH = new Date().getHours();
      function ok(v) { return v !== null && v !== undefined; }
      // 雨上がりの昼なら、背景に虹を出す（いまは雨でなく、直前の3時間のうちに雨があった）
      (function () {
        const nowCode = h.weather_code[nowH];
        let rainedBefore = false;
        for (let k = Math.max(0, nowH - 3); k < nowH; k++) if (ok(h.weather_code[k]) && isRainy(h.weather_code[k])) rainedBefore = true;
        setRainbow(ok(nowCode) && !isRainy(nowCode) && !isSnowy(nowCode) && nowCode < 45 && rainedBefore && nowH >= 7 && nowH < 17);
      })();
      let html = "";
      [[t0, 0], [t1, 24]].forEach(function (day, di) {
        html += '<div class="hday">' + (di === 0 ? "今日" : "明日") + "（" + ymdLabel(day[0]) + "）</div><div class=\"hours\">";
        for (let slot = 0; slot < 8; slot++) {
          const from = day[1] + slot * 3;
          const codes = [], temps = [], pops = [];
          for (let k = from; k < from + 3; k++) {
            if (ok(h.weather_code[k])) codes.push(h.weather_code[k]);
            if (ok(h.temperature_2m[k])) temps.push(h.temperature_2m[k]);
            if (ok(h.precipitation_probability[k])) pops.push(h.precipitation_probability[k]);
          }
          const label = (slot * 3) + "時";
          if (codes.length === 0) {
            html += '<div class="hcell"><div class="h-time">' + label + '</div><div class="h-icon">-</div></div>';
            continue;
          }
          // その3時間でいちばん悪い天気（1日の天気と同じ考え方）
          const code = Math.max.apply(null, codes);
          const temp = temps.length ? Math.round(temps.reduce(function (a, b) { return a + b; }, 0) / temps.length) : null;
          const pop = pops.length ? Math.round(Math.max.apply(null, pops)) : null;
          const isToday = di === 0;
          const past = isToday && (slot * 3 + 2) < nowH;
          const now = isToday && nowH >= slot * 3 && nowH < slot * 3 + 3;
          const name = weatherText(code);
          html += '<div role="img" class="hcell hc-' + themeFor(code) + (past ? " past" : "") + (now ? " now" : "")
            + '" title="' + (slot * 3) + "〜" + (slot * 3 + 3) + "時 " + esc(name) + '" aria-label="' + (slot * 3) + "時から3時間 " + esc(name) + '">'
            + '<div class="h-time">' + label + "</div>"
            + '<div class="h-icon">' + name.split(" ")[0] + "</div>"
            + '<div class="h-temp">' + (temp === null ? "-" : temp + "°") + "</div>"
            + '<div class="h-pop">' + (pop === null ? "-" : pop + "%") + "</div></div>";
        }
        html += "</div>";
      });
      el.innerHTML = "<h2>🕒 今日・明日の時間ごとの天気（" + esc(region.name) + "）</h2>" + html
        + '<p class="note">3時間ごとの天気・気温・降水確率です。天気は、その3時間でいちばん悪い天気を表示しています。青い枠は、いまの時間帯です。</p>';
    } catch (e) {
      if (my !== hourSeq) return;
      el.innerHTML = '<h2>🕒 今日・明日の時間ごとの天気</h2><p class="error">取得できませんでした。（' + esc(e.message) + "）</p>";
    }
  }

  // ---- 設定バー（郵便番号・地域・日付の設定を、開閉する）----
  const SETTINGS_KEY = "weather-practice:settings";
  const settingsToggle = document.getElementById("settingsToggle");
  const settingsPanel = document.getElementById("settingsPanel");

  // バーに、いまの場所と日付を出す（設定を閉じていても、何を見ているかわかるように）
  function updateSettingsSummary() {
    const region = currentRegion();
    const name = region ? region.name.replace(/^〒[0-9-]+\s*/, "") : "";
    document.getElementById("sbPlace").textContent = "📍 " + name;
    const date = dateEl.value;
    document.getElementById("sbDate").textContent = !date ? "" :
      (date === todayStr ? "今日 " : date === addDays(todayStr, 1) ? "明日 " : "") + ymdLabel(date);
    // 今日以外の日を見ているときだけ、ワンタッチで今日に戻るボタンを出す
    document.getElementById("todayBtn").hidden = (date === todayStr);
  }
  document.getElementById("todayBtn").addEventListener("click", function () {
    dateEl.value = todayStr;
    dateEl.dispatchEvent(new Event("change")); // カレンダーで選んだときと同じ処理が動く
    window.scrollTo(0, 0); // 下までスクロールしていても、すぐ上に戻って、今日の天気が見えるようにする
  });
  function setSettingsOpen(open, save) {
    settingsPanel.hidden = !open;
    settingsToggle.setAttribute("aria-expanded", String(open));
    document.getElementById("sbLabel").textContent = open ? "閉じる" : "設定";
    document.getElementById("sbChev").textContent = open ? "▴" : "▾";
    if (save) { try { localStorage.setItem(SETTINGS_KEY, open ? "open" : "closed"); } catch (e) { /* 保存できなくても、開閉はできる */ } }
  }
  settingsToggle.addEventListener("click", function () {
    const open = settingsPanel.hidden; // いま閉じていれば、開く
    setSettingsOpen(open, true);
    // 下までスクロールしていても、開いた設定が見えるように、すぐ上に戻る
    // （なめらかなスクロールは、設定が開いてページが伸びた直後の位置調整とぶつかるため、使わない）
    if (open && window.scrollY > 0) window.scrollTo(0, 0);
  });
  (function restoreSettingsState() {
    let open = true; // 初めて開いたときは、設定を開いておく
    try { if (localStorage.getItem(SETTINGS_KEY) === "closed") open = false; } catch (e) { /* 読めなければ開いたまま */ }
    setSettingsOpen(open, false);
  })();

  // ---- 選んだ日の天気 ----
  let seq = 0;
  const insightsEl = document.getElementById("insights");

  async function update() {
    const my = ++seq;
    updateSettingsSummary();
    const region = currentRegion();
    const date = dateEl.value;
    if (!date) { show('<p class="message">日付を選んでください。</p>'); return; }
    if (date < dateEl.min || date > dateEl.max) {
      show('<p class="error">選べる日付は ' + dateEl.min + ' から ' + dateEl.max + ' までです。</p>');
      applyTheme(null);
      insightsEl.hidden = true;
      return;
    }
    show('<p class="message">読み込み中…</p>');

    try {
      const d = await getDaily(region, date);
      if (my !== seq) return;
      if (!d) {
        show('<p class="error">この日のデータがありません。別の日付で試してください。</p>');
        applyTheme(null);
        insightsEl.hidden = true;
        return;
      }
      const rainHtml = d.rain === null
        ? '<strong class="none">データなし</strong>'
        : "<strong>" + Math.round(d.rain) + "%</strong>";
      show(
        '<div class="date">' + esc(region.name) + "　" + d.date + "</div>"
        + '<div class="weather">' + weatherText(d.code) + "</div>"
        + '<div class="temps">'
        + '<div class="max">最高気温<strong>' + Math.round(d.max) + "℃</strong></div>"
        + '<div class="min">最低気温<strong>' + Math.round(d.min) + "℃</strong></div>"
        + '<div class="rain">降水確率' + rainHtml + "</div>"
        + "</div>"
      );
      applyTheme(d.code);
      // 選んだ日の詳細（雨の時間帯・前日と去年との比べ・答え合わせ）。見出しには、何の日かを出す
      document.getElementById("insightsTitle").textContent = "📌 "
        + (date === todayStr ? "今日" : date === addDays(todayStr, 1) ? "明日" : ymdLabel(date)) + "の詳細";
      insightsEl.hidden = false;
      ["rainBlock", "compareBlock", "verifyBlock"].forEach(function (id) {
        document.getElementById(id).innerHTML = '<div class="message">読み込み中…</div>';
      });
      renderRainBlock(my, region, date);
      renderCompareBlock(my, region, date, d);
      renderVerifyBlock(my, region, date);
    } catch (e) {
      if (my !== seq) return;
      insightsEl.hidden = true;
      applyTheme(null);
      show('<p class="error">天気を取得できませんでした。時間をおいて、もう一度試してください。（' + esc(e.message) + "）</p>");
    }
  }

  // ---- 郵便番号 → その場所の天気 ----
  const zipEl = document.getElementById("zip");
  const zipBtn = document.getElementById("zipBtn");
  const zipMsg = document.getElementById("zipMsg");
  function setZipMsg(text, isErr) {
    zipMsg.textContent = text;
    zipMsg.className = "zip-msg" + (isErr ? " err" : "");
  }
  // 国土地理院の住所検索で、住所から緯度・経度を調べる（見つからなければ null）
  async function geocode(address, prefix) {
    const list = await getJson("https://msearch.gsi.go.jp/address-search/AddressSearch?q=" + encodeURIComponent(address));
    const hit = list.find(function (f) { return f.properties && f.properties.title && f.properties.title.indexOf(prefix) === 0; });
    return hit ? { lon: hit.geometry.coordinates[0], lat: hit.geometry.coordinates[1] } : null;
  }
  async function applyZip() {
    const z = zipEl.value
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[^0-9]/g, "");
    if (!/^[0-9]{7}$/.test(z)) { setZipMsg("郵便番号は7けたの数字で入れてください（例: 1600023）", true); return; }
    zipBtn.disabled = true;
    setZipMsg("調べています…", false);
    try {
      const j = await getJson("https://zipcloud.ibsnet.co.jp/api/search?zipcode=" + z);
      if (!j.results || j.results.length === 0) { setZipMsg("その郵便番号は見つかりませんでした", true); return; }
      const r = j.results[0];
      const town = r.address3.indexOf("以下に掲載がない場合") >= 0 ? "" : r.address3.replace(/（.*$/, "");
      const label = "〒" + z.slice(0, 3) + "-" + z.slice(3) + " " + r.address1 + r.address2 + town;
      let pos = null;
      try {
        pos = await geocode(r.address1 + r.address2 + town, r.address1 + r.address2);
        if (!pos && town) pos = await geocode(r.address1 + r.address2, r.address1 + r.address2);
      } catch (e) { /* 位置が調べられなくても、下で県庁所在地に切り替える */ }
      if (pos) {
        setCustom({ name: label, lat: pos.lat, lon: pos.lon });
        setZipMsg(label + " の天気を表示しています", false);
      } else {
        const idx = REGIONS.findIndex(function (x) { return x.name.indexOf(r.address1) === 0; });
        if (idx < 0) { setZipMsg("位置を調べられませんでした。地域を選んでください", true); return; }
        regionEl.value = String(idx);
        setZipMsg("ピンポイントの位置が調べられなかったため、" + REGIONS[idx].name + "（県庁所在地）の天気を表示しています", false);
      }
      saveLoc();
      update();
      updateWeek();
      updateHourly();
    } catch (e) {
      setZipMsg("郵便番号を調べられませんでした。時間をおくか、地域を選んでください（" + e.message + "）", true);
    } finally {
      zipBtn.disabled = false;
    }
  }
  zipBtn.addEventListener("click", applyZip);
  zipEl.addEventListener("keydown", function (e) { if (e.key === "Enter") applyZip(); });

  // ---- セクションの並び替え（▲▼で動かす。並び順はブラウザに保存）----
  const ORDER_KEY = "weather-practice:order";
  const DEFAULT_ORDER = ["result", "hourly", "insights", "outfit", "week"];
  const SEC_NAMES = { result: "🌤 選んだ日の天気", hourly: "🕒 時間ごとの天気", insights: "📌 選んだ日の詳細", outfit: "👕 おすすめの服装", week: "📅 1週間の予報" };
  const sectionsEl = document.getElementById("sections");
  const editBtn = document.getElementById("editBtn");
  const resetOrderBtn = document.getElementById("resetOrderBtn");

  function currentOrder() {
    return Array.prototype.map.call(sectionsEl.children, function (el) { return el.dataset.id; });
  }
  function refreshMoveButtons() {
    const kids = sectionsEl.children;
    for (let i = 0; i < kids.length; i++) {
      kids[i].querySelector(".up").disabled = (i === 0);
      kids[i].querySelector(".down").disabled = (i === kids.length - 1);
    }
  }
  function applyOrder(order) {
    order.forEach(function (id) { sectionsEl.appendChild(sectionsEl.querySelector('[data-id="' + id + '"]')); });
    refreshMoveButtons();
  }
  function saveOrder() {
    try { localStorage.setItem(ORDER_KEY, JSON.stringify(currentOrder())); } catch (e) { /* 保存できなくても、この画面では並び替えできる */ }
  }
  function loadOrder() {
    const order = [];
    try {
      const v = JSON.parse(localStorage.getItem(ORDER_KEY));
      if (Array.isArray(v)) v.forEach(function (id) { if (DEFAULT_ORDER.indexOf(id) >= 0 && order.indexOf(id) < 0) order.push(id); });
    } catch (e) { /* 読めなければ初期の順番 */ }
    DEFAULT_ORDER.forEach(function (id) { if (order.indexOf(id) < 0) order.push(id); });
    return order;
  }

  // 各セクションの上に、名前と ▲▼ ボタンの帯を付ける（並び替え中だけ表示）
  Array.prototype.forEach.call(sectionsEl.children, function (sec) {
    const name = SEC_NAMES[sec.dataset.id];
    const bar = document.createElement("div");
    bar.className = "sec-bar";
    bar.innerHTML = '<span class="name">' + name + '</span>'
      + '<button type="button" class="up" aria-label="' + name + ' を上へ">▲</button>'
      + '<button type="button" class="down" aria-label="' + name + ' を下へ">▼</button>';
    sec.insertBefore(bar, sec.firstChild);
  });
  sectionsEl.addEventListener("click", function (e) {
    const btn = e.target.closest("button");
    if (!btn || !btn.closest(".sec-bar")) return;
    const sec = btn.closest(".sec");
    if (btn.classList.contains("up") && sec.previousElementSibling) {
      sectionsEl.insertBefore(sec, sec.previousElementSibling);
    } else if (btn.classList.contains("down") && sec.nextElementSibling) {
      sectionsEl.insertBefore(sec.nextElementSibling, sec);
    } else {
      return;
    }
    refreshMoveButtons();
    saveOrder();
    sec.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
    btn.focus();
  });
  editBtn.addEventListener("click", function () {
    const on = !document.body.classList.contains("editing");
    document.body.classList.toggle("editing", on);
    editBtn.setAttribute("aria-pressed", String(on));
    editBtn.textContent = on ? "✓ 並び替えを終える" : "⇅ 並び替え";
    resetOrderBtn.hidden = !on;
  });
  resetOrderBtn.addEventListener("click", function () {
    applyOrder(DEFAULT_ORDER);
    try { localStorage.removeItem(ORDER_KEY); } catch (e) { /* 何もしない */ }
  });
  applyOrder(loadOrder());

  regionEl.addEventListener("change", function () { saveLoc(); refreshDefaultUi(); update(); updateWeek(); updateHourly(); });
  dateEl.addEventListener("change", update);
  refreshScene(true);
  setInterval(function () { refreshScene(false); }, 60000);
  // ホーム画面から開いたアプリには更新ボタンがない。15分以上バックグラウンドにいたあと戻ってきたら、読み直す（日付・天気を最新にする）
  let hiddenAt = 0;
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 15 * 60 * 1000) location.reload();
    hiddenAt = 0;
  });
  update();
  updateWeek();
  updateHourly();
</script>
</body>
</html>
