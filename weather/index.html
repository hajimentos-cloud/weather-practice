<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お天気チェック</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #eaf3fb;
    color: #1f2d3d;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  main {
    width: 100%;
    max-width: 480px;
    padding: 24px 16px;
    flex: 1;
  }
  h1 { font-size: 1.5rem; text-align: center; margin: 0 0 20px; }
  .controls {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }
  label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 6px; }
  select, input[type="date"] {
    width: 100%;
    font-size: 1rem;
    padding: 10px;
    border: 1px solid #b8c6d4;
    border-radius: 8px;
    margin-bottom: 14px;
    background: #fff;
  }
  .controls > :last-child { margin-bottom: 0; }
  .result {
    margin-top: 20px;
    background: #fff;
    border-radius: 12px;
    padding: 24px 16px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }
  .result .date { font-size: 0.95rem; color: #5a6b7c; }
  .result .weather { font-size: 2rem; font-weight: bold; margin: 8px 0 16px; }
  .temps { display: flex; justify-content: center; gap: 32px; }
  .temps div { font-size: 0.85rem; color: #5a6b7c; }
  .temps strong { display: block; font-size: 1.6rem; }
  .max strong { color: #d9480f; }
  .min strong { color: #1971c2; }
  .rain strong { color: #2b8a3e; }
  .rain strong.none { font-size: 1rem; color: #868e96; line-height: 2.4rem; }
  .message { color: #5a6b7c; }
  .error { color: #c92a2a; }
  .card {
    margin-top: 16px;
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }
  .card h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .card ul { margin: 0; padding-left: 1.2em; line-height: 1.8; }
  .note { font-size: 0.75rem; color: #868e96; margin: 10px 0 0; }
  .week-row {
    display: grid;
    grid-template-columns: 4.6em 1fr auto 3em;
    gap: 8px;
    align-items: center;
    padding: 8px 0;
    border-top: 1px solid #e9eef3;
    font-size: 0.9rem;
  }
  .week-row:first-of-type { border-top: none; }
  .week-row .wd { color: #5a6b7c; }
  .week-row .t-max { color: #d9480f; font-weight: bold; }
  .week-row .t-min { color: #1971c2; font-weight: bold; }
  .week-row .pop { text-align: right; color: #2b8a3e; }
  .sign-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .sign-row select { margin-bottom: 0; }
  .fortune-day { margin-bottom: 14px; }
  .fortune-day:last-of-type { margin-bottom: 0; }
  .fortune-head { font-weight: bold; margin-bottom: 4px; }
  .rank { color: #e8590c; }
  details { margin-top: 8px; font-size: 0.9rem; }
  details ol { margin: 6px 0 0; padding-left: 1.6em; line-height: 1.7; }
  footer {
    font-size: 0.8rem;
    color: #5a6b7c;
    padding: 16px;
    text-align: center;
  }
  footer a { color: #1971c2; }
</style>
</head>
<body>
<main>
  <h1>お天気チェック</h1>
  <div class="controls">
    <label for="region">地域</label>
    <select id="region"></select>
    <label for="date">日付</label>
    <input type="date" id="date">
  </div>
  <div class="result" id="result">
    <p class="message">地域と日付を選んでください。</p>
  </div>
  <div class="card" id="outfit" hidden></div>
  <div class="card" id="horoscope" hidden></div>
  <div class="card" id="week">
    <h2>1週間の予報</h2>
    <p class="message">読み込み中…</p>
  </div>
</main>
<footer>
  天気データ: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>（<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>）
</footer>

<script>
  // 47都道府県の県庁所在地（緯度・経度）
  const REGIONS = [
    { name: "北海道（札幌）", lat: 43.0642, lon: 141.3469 },
    { name: "青森県（青森）", lat: 40.8244, lon: 140.7400 },
    { name: "岩手県（盛岡）", lat: 39.7036, lon: 141.1527 },
    { name: "宮城県（仙台）", lat: 38.2688, lon: 140.8721 },
    { name: "秋田県（秋田）", lat: 39.7186, lon: 140.1024 },
    { name: "山形県（山形）", lat: 38.2404, lon: 140.3633 },
    { name: "福島県（福島）", lat: 37.7503, lon: 140.4676 },
    { name: "茨城県（水戸）", lat: 36.3418, lon: 140.4468 },
    { name: "栃木県（宇都宮）", lat: 36.5658, lon: 139.8836 },
    { name: "群馬県（前橋）", lat: 36.3911, lon: 139.0608 },
    { name: "埼玉県（さいたま）", lat: 35.8617, lon: 139.6455 },
    { name: "千葉県（千葉）", lat: 35.6046, lon: 140.1233 },
    { name: "東京都（新宿）", lat: 35.6895, lon: 139.6917 },
    { name: "神奈川県（横浜）", lat: 35.4478, lon: 139.6425 },
    { name: "新潟県（新潟）", lat: 37.9026, lon: 139.0236 },
    { name: "富山県（富山）", lat: 36.6953, lon: 137.2113 },
    { name: "石川県（金沢）", lat: 36.5947, lon: 136.6256 },
    { name: "福井県（福井）", lat: 36.0652, lon: 136.2216 },
    { name: "山梨県（甲府）", lat: 35.6642, lon: 138.5684 },
    { name: "長野県（長野）", lat: 36.6513, lon: 138.1810 },
    { name: "岐阜県（岐阜）", lat: 35.3912, lon: 136.7223 },
    { name: "静岡県（静岡）", lat: 34.9769, lon: 138.3831 },
    { name: "愛知県（名古屋）", lat: 35.1802, lon: 136.9066 },
    { name: "三重県（津）", lat: 34.7303, lon: 136.5086 },
    { name: "滋賀県（大津）", lat: 35.0045, lon: 135.8686 },
    { name: "京都府（京都）", lat: 35.0214, lon: 135.7556 },
    { name: "大阪府（大阪）", lat: 34.6937, lon: 135.5023 },
    { name: "兵庫県（神戸）", lat: 34.6913, lon: 135.1830 },
    { name: "奈良県（奈良）", lat: 34.6851, lon: 135.8049 },
    { name: "和歌山県（和歌山）", lat: 34.2260, lon: 135.1675 },
    { name: "鳥取県（鳥取）", lat: 35.5039, lon: 134.2383 },
    { name: "島根県（松江）", lat: 35.4723, lon: 133.0505 },
    { name: "岡山県（岡山）", lat: 34.6618, lon: 133.9344 },
    { name: "広島県（広島）", lat: 34.3966, lon: 132.4596 },
    { name: "山口県（山口）", lat: 34.1861, lon: 131.4714 },
    { name: "徳島県（徳島）", lat: 34.0658, lon: 134.5593 },
    { name: "香川県（高松）", lat: 34.3402, lon: 134.0434 },
    { name: "愛媛県（松山）", lat: 33.8416, lon: 132.7657 },
    { name: "高知県（高知）", lat: 33.5597, lon: 133.5311 },
    { name: "福岡県（福岡）", lat: 33.6064, lon: 130.4183 },
    { name: "佐賀県（佐賀）", lat: 33.2494, lon: 130.2988 },
    { name: "長崎県（長崎）", lat: 32.7503, lon: 129.8777 },
    { name: "熊本県（熊本）", lat: 32.7898, lon: 130.7417 },
    { name: "大分県（大分）", lat: 33.2382, lon: 131.6126 },
    { name: "宮崎県（宮崎）", lat: 31.9111, lon: 131.4239 },
    { name: "鹿児島県（鹿児島）", lat: 31.5602, lon: 130.5581 },
    { name: "沖縄県（那覇）", lat: 26.2124, lon: 127.6809 }
  ];

  // 天気コード（WMO）を日本語に変換
  function weatherText(code) {
    if (code === 0) return "☀️ 快晴";
    if (code === 1) return "🌤 晴れ";
    if (code === 2) return "⛅ 晴れ時々くもり";
    if (code === 3) return "☁️ くもり";
    if (code === 45 || code === 48) return "🌫 霧";
    if (code >= 51 && code <= 57) return "🌦 霧雨";
    if (code >= 61 && code <= 67) return "🌧 雨";
    if (code >= 71 && code <= 77) return "❄️ 雪";
    if (code >= 80 && code <= 82) return "🌧 にわか雨";
    if (code === 85 || code === 86) return "❄️ にわか雪";
    if (code === 95) return "⛈ 雷雨";
    if (code === 96 || code === 99) return "⛈ 雷雨（ひょうを伴う）";
    return "不明（コード " + code + "）";
  }

  const regionEl = document.getElementById("region");
  const dateEl = document.getElementById("date");
  const resultEl = document.getElementById("result");

  REGIONS.forEach(function (r, i) {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = r.name;
    regionEl.appendChild(opt);
  });
  regionEl.value = 12; // 東京

  function toYMD(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  // 選べる日付: 今日の92日前から、予報APIが返せる最終日（今日を含めて16日間＝15日後）まで
  const today = new Date();
  const minDate = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 92);
  const maxDate = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 15);
  dateEl.min = toYMD(minDate);
  dateEl.max = toYMD(maxDate);
  dateEl.value = toYMD(today);

  function show(html) { resultEl.innerHTML = html; }

  const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];
  const tomorrow = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1);
  const todayStr = toYMD(today);
  const tomorrowStr = toYMD(tomorrow);

  function ymdLabel(ymd) {
    const p = ymd.split("-");
    const dt = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return Number(p[1]) + "/" + Number(p[2]) + "(" + WEEKDAYS[dt.getDay()] + ")";
  }

  // 雨・雪の天気コードか
  function isRainy(code) {
    return (code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95;
  }
  function isSnowy(code) {
    return (code >= 71 && code <= 77) || code === 85 || code === 86;
  }

  // おすすめの服装（最高・最低気温、降水確率、天気コードから決める）
  function outfitAdvice(max, min, rain, code) {
    const items = [];
    if (max >= 30) items.push("半袖・薄手のワンピースなど、涼しい服装。帽子と水分補給も忘れずに");
    else if (max >= 25) items.push("半袖で過ごせる暖かさ。日差し対策に薄手の羽織りがあると安心");
    else if (max >= 20) items.push("長袖シャツや薄手のカーディガンがちょうどいい暖かさ");
    else if (max >= 15) items.push("薄手のセーターやパーカーに、軽めの上着を");
    else if (max >= 10) items.push("厚手のニットに、コートやジャケットを");
    else if (max >= 5) items.push("冬用のコートに、マフラーや手袋を");
    else items.push("ダウンなどの防寒着に、マフラー・手袋・ニット帽を");

    if (min <= 12 && max >= 20) items.push("朝晩は冷えるので、脱ぎ着しやすい上着を持っていくと◎");
    else if (max - min >= 10) items.push("昼と朝晩の気温差が大きいので、重ね着で調整を");

    if (isSnowy(code)) items.push("雪の予報。滑りにくい靴と、防寒・防水の備えを");
    else if (rain !== null && rain >= 50) items.push("雨の可能性が高いので、傘と濡れても困らない靴を");
    else if (isRainy(code)) items.push("雨の予報なので、傘があると安心");
    else if (rain !== null && rain >= 30) items.push("降るかもしれないので、折りたたみ傘があると安心");
    return items;
  }

  // ---- 星座占い（エンタメ用。日付と星座から、このページ内で毎回同じ結果を作る。外部サービスは使わない）----
  const SIGNS = [
    { name: "おひつじ座", period: "3/21〜4/19" }, { name: "おうし座", period: "4/20〜5/20" },
    { name: "ふたご座", period: "5/21〜6/21" }, { name: "かに座", period: "6/22〜7/22" },
    { name: "しし座", period: "7/23〜8/22" }, { name: "おとめ座", period: "8/23〜9/22" },
    { name: "てんびん座", period: "9/23〜10/23" }, { name: "さそり座", period: "10/24〜11/22" },
    { name: "いて座", period: "11/23〜12/21" }, { name: "やぎ座", period: "12/22〜1/19" },
    { name: "みずがめ座", period: "1/20〜2/18" }, { name: "うお座", period: "2/19〜3/20" }
  ];
  const LUCKY_COLORS = ["赤", "オレンジ", "黄色", "緑", "水色", "青", "紫", "ピンク", "白", "黒", "ベージュ", "ゴールド"];
  const FORTUNE_GOOD = [
    "思い切って一歩踏み出すと、いい流れに乗れそう。",
    "周りの人に感謝を伝えると、うれしい返事がありそう。",
    "ひらめきが冴える日。気になったことはすぐメモを。"
  ];
  const FORTUNE_NORMAL = [
    "いつもどおりが吉。小さな楽しみを1つ作ってみて。",
    "焦らずマイペースで。休憩をこまめにとると調子が上がります。",
    "身近な人との会話に、ヒントが隠れていそう。"
  ];
  const FORTUNE_CAREFUL = [
    "慌てず確認を丁寧に。早めの帰宅でゆっくり休んで。",
    "無理は禁物。人に頼ることで、うまく回りそう。",
    "小さなミスに注意。深呼吸してから動き出して。"
  ];

  function hashSeed(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function makeRng(seed) {
    let a = seed;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // その日の12星座の順位（1〜12位）を作る
  function dailyRanking(dateStr) {
    const rng = makeRng(hashSeed("rank:" + dateStr));
    const order = SIGNS.map(function (_, i) { return i; });
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    return order; // order[0] が1位の星座の番号
  }
  function fortuneFor(signIndex, dateStr) {
    const order = dailyRanking(dateStr);
    const rank = order.indexOf(signIndex) + 1;
    const rng = makeRng(hashSeed("detail:" + dateStr + ":" + signIndex));
    const pool = rank <= 3 ? FORTUNE_GOOD : (rank <= 8 ? FORTUNE_NORMAL : FORTUNE_CAREFUL);
    return {
      rank: rank,
      color: LUCKY_COLORS[Math.floor(rng() * LUCKY_COLORS.length)],
      message: pool[Math.floor(rng() * pool.length)],
      order: order
    };
  }

  const SIGN_KEY = "weather-practice:sign";
  function loadSign() {
    try {
      const v = Number(localStorage.getItem(SIGN_KEY));
      if (Number.isInteger(v) && v >= 0 && v < SIGNS.length) return v;
    } catch (e) { /* 保存できない環境では初期値を使う */ }
    return 0;
  }
  function saveSign(v) {
    try { localStorage.setItem(SIGN_KEY, String(v)); } catch (e) { /* 何もしない */ }
  }
  let signIndex = loadSign();

  const outfitEl = document.getElementById("outfit");
  const horoscopeEl = document.getElementById("horoscope");
  const weekEl = document.getElementById("week");

  // 今日・明日のおすすめの服装（1週間の予報のデータを使う）
  function renderOutfit(d) {
    let body = "";
    [["今日", 0], ["明日", 1]].forEach(function (pair) {
      const i = pair[1];
      const rain = d.precipitation_probability_max[i];
      const items = outfitAdvice(
        d.temperature_2m_max[i], d.temperature_2m_min[i],
        (rain === null || rain === undefined) ? null : rain, d.weather_code[i]
      );
      body += '<div class="fortune-day"><div class="fortune-head">' + pair[0] + "（" + ymdLabel(d.time[i]) + "）</div><ul>"
        + items.map(function (t) { return "<li>" + t + "</li>"; }).join("")
        + "</ul></div>";
    });
    outfitEl.innerHTML = "<h2>👕 今日・明日のおすすめの服装</h2>" + body
      + '<p class="note">※ 選んだ地域の気温・降水確率から決めています。</p>';
    outfitEl.hidden = false;
  }

  function renderHoroscope() {
    const sel = SIGNS.map(function (g, i) {
      return '<option value="' + i + '"' + (i === signIndex ? " selected" : "") + ">" + g.name + "（" + g.period + "）</option>";
    }).join("");
    let body = "";
    [["今日", todayStr], ["明日", tomorrowStr]].forEach(function (pair) {
      const f = fortuneFor(signIndex, pair[1]);
      const list = f.order.map(function (si) { return "<li>" + SIGNS[si].name + "</li>"; }).join("");
      body += '<div class="fortune-day">'
        + '<div class="fortune-head">' + pair[0] + "（" + ymdLabel(pair[1]) + "）　" + '<span class="rank">' + f.rank + "位</span></div>"
        + "<div>ラッキーカラー: " + f.color + "</div>"
        + "<div>" + f.message + "</div>"
        + "<details><summary>12星座のランキング</summary><ol>" + list + "</ol></details>"
        + "</div>";
    });
    horoscopeEl.innerHTML = "<h2>🔮 今日・明日の星座占い</h2>"
      + '<div class="sign-row"><select id="sign" aria-label="星座">' + sel + "</select></div>"
      + body
      + '<p class="note">※ 星座占いはお楽しみ用です。日付と星座から、このページの中で作っています（天気データとは関係ありません）。</p>';
    horoscopeEl.hidden = false;
    document.getElementById("sign").addEventListener("change", function (e) {
      signIndex = Number(e.target.value);
      saveSign(signIndex);
      renderHoroscope();
    });
  }

  // 1週間の予報（今日から7日間。選んだ地域に合わせる）
  async function updateWeek() {
    const region = REGIONS[regionEl.value];
    weekEl.innerHTML = '<h2>1週間の予報</h2><p class="message">読み込み中…</p>';
    const url = "https://api.open-meteo.com/v1/forecast"
      + "?latitude=" + region.lat
      + "&longitude=" + region.lon
      + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
      + "&timezone=Asia%2FTokyo&forecast_days=7";
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const d = (await res.json()).daily;
      let rows = "";
      for (let i = 0; i < d.time.length; i++) {
        const pop = d.precipitation_probability_max[i];
        rows += '<div class="week-row">'
          + '<div class="wd">' + ymdLabel(d.time[i]) + "</div>"
          + "<div>" + weatherText(d.weather_code[i]) + "</div>"
          + '<div><span class="t-max">' + Math.round(d.temperature_2m_max[i]) + '℃</span> / <span class="t-min">'
          + Math.round(d.temperature_2m_min[i]) + "℃</span></div>"
          + '<div class="pop">' + (pop === null || pop === undefined ? "-" : Math.round(pop) + "%") + "</div>"
          + "</div>";
      }
      renderOutfit(d);
      weekEl.innerHTML = "<h2>1週間の予報（" + region.name + "）</h2>" + rows
        + '<p class="note">右端は降水確率です。</p>';
    } catch (e) {
      outfitEl.hidden = true;
      weekEl.innerHTML = '<h2>1週間の予報</h2><p class="error">取得できませんでした。（' + e.message + "）</p>";
    }
  }

  async function update() {
    const region = REGIONS[regionEl.value];
    const date = dateEl.value;
    if (!date) { show('<p class="message">日付を選んでください。</p>'); return; }
    if (date < dateEl.min || date > dateEl.max) {
      show('<p class="error">選べる日付は ' + dateEl.min + ' から ' + dateEl.max + ' までです。</p>');
      return;
    }
    show('<p class="message">読み込み中…</p>');

    // 降水確率は予報APIだけにある。過去データAPIには無いので、取れない日は「データなし」と表示する
    async function fetchDaily(base, withRain) {
      const query = "?latitude=" + region.lat
        + "&longitude=" + region.lon
        + "&daily=weather_code,temperature_2m_max,temperature_2m_min"
        + (withRain ? ",precipitation_probability_max" : "")
        + "&timezone=Asia%2FTokyo"
        + "&start_date=" + date
        + "&end_date=" + date;
      const res = await fetch(base + query);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return (await res.json()).daily;
    }

    try {
      let d = await fetchDaily("https://api.open-meteo.com/v1/forecast", true);
      // 古い日付は予報APIだと空になるため、同じ Open-Meteo の過去データAPIで取り直す
      if (d && d.weather_code && d.weather_code[0] === null) {
        d = await fetchDaily("https://archive-api.open-meteo.com/v1/archive", false);
      }
      if (!d || !d.time || d.time.length === 0 || d.weather_code[0] === null) {
        show('<p class="error">この日のデータがありません。別の日付で試してください。</p>');
        return;
      }
      const rain = d.precipitation_probability_max ? d.precipitation_probability_max[0] : null;
      const rainHtml = (rain === null || rain === undefined)
        ? '<strong class="none">データなし</strong>'
        : "<strong>" + Math.round(rain) + "%</strong>";
      show(
        '<div class="date">' + region.name + "　" + d.time[0] + "</div>"
        + '<div class="weather">' + weatherText(d.weather_code[0]) + "</div>"
        + '<div class="temps">'
        + '<div class="max">最高気温<strong>' + Math.round(d.temperature_2m_max[0]) + "℃</strong></div>"
        + '<div class="min">最低気温<strong>' + Math.round(d.temperature_2m_min[0]) + "℃</strong></div>"
        + '<div class="rain">降水確率' + rainHtml + "</div>"
        + "</div>"
      );
    } catch (e) {
      show('<p class="error">天気を取得できませんでした。時間をおいて、もう一度試してください。（' + e.message + "）</p>");
    }
  }

  regionEl.addEventListener("change", function () { update(); updateWeek(); });
  dateEl.addEventListener("change", update);
  update();
  updateWeek();
  renderHoroscope();
</script>
</body>
</html>
